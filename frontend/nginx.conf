# 14.3: the static host for build/client. Same rules as public/_headers (the contract for Netlify/Vercel-style hosts):
#   - an unknown URL without a file extension gets the SPA shell, so deep links and refresh work
#   - hashed files under /assets are immutable for a year; the HTML shell and the service worker are always revalidated
#   - security headers (CSP, nosniff, ...) come from the build (build-headers.mjs) so they match the API origin
# `add_header` is NOT inherited into a location that has its own add_header: every location below includes the
# security headers again (the classic nginx trap).
server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript text/javascript
             application/manifest+json image/svg+xml application/xml;

  # Liveness probe for Docker / the orchestrator.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Hashed build output: the file name changes when the content does.
  # `^~` = a prefix match that STOPS the search: without it, the regex location for *.js below would also match
  # /assets/x.js and win over this one (nginx tries regexes after the longest prefix unless it is `^~`).
  location ^~ /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # A service worker with a long cache would pin users to old code.
  location = /sw.js {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
  }

  location ^~ /icons/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }

  location ~ ^/(robots\.txt|sitemap\.xml)$ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # A missing file WITH an extension is a real 404, not the HTML shell (a stale chunk must not parse as JS).
  location ~* \.(?:js|mjs|css|map|png|jpe?g|webp|svg|ico|woff2?|json|txt|xml)$ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Everything else is an app route: a prerendered page when one exists (/help/index.html), else the shell.
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/index.html /__spa-fallback.html;
  }
}
