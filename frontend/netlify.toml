# 14.5: Netlify as the static host. Security + cache headers come from build/client/_headers (Netlify reads it natively;
# it is generated by `npm run build` from public/_headers, so they match this build's API origin). Only the SPA
# rewrite and the build live here. Set VITE_API_URL, VITE_SITE_URL (and optionally VITE_SENTRY_DSN) in
# Site settings > Environment variables: they are read while the build runs.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "build/client"

[build.environment]
  NODE_VERSION = "24"

# A missing hashed asset is a 404, not the HTML shell.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# Real files win over a rewrite (force = false): assets, prerendered pages and sw.js are served as they are.
# The SPA shell answers every other extension-less URL; a missing /assets/x.js stays a 404.
[[redirects]]
  from = "/*"
  to = "/__spa-fallback.html"
  status = 200
  force = false
