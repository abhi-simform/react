# Local development infrastructure for ShopSphere.
# The apps (frontend/admin/backend) run on your host with `npm run dev`;
# only the stateful services live in Docker.
#
#   docker compose up -d                     # mongo + mongo-express + mailpit
#   docker compose --profile cache up -d     # + redis
#   docker compose --profile app up -d       # + backend container (prod-like)
#   docker compose down                      # stop (data kept)
#   docker compose down -v                   # stop AND wipe all data

name: shopsphere

services:
  mongo:
    image: mongo:7.0
    container_name: shopsphere-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    # Single-node replica set: required for multi-document transactions (orders + stock).
    command: ["--replSet", "rs0", "--bind_ip_all", "--noauth"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first run, then reports healthy once PRIMARY.
      test: >
        mongosh --quiet --eval "
        try { rs.status().ok } catch (e) {
          rs.initiate({_id:'rs0', members:[{_id:0, host:'localhost:27017'}]}).ok
        }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  mongo-express:
    image: mongo-express:1
    container_name: shopsphere-mongo-express
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/?directConnection=true
      ME_CONFIG_BASICAUTH: "false"

  mailpit:
    image: axllent/mailpit:latest
    container_name: shopsphere-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  redis:
    image: redis:7-alpine
    container_name: shopsphere-redis
    profiles: ["cache"]
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend:
    build: ./backend
    container_name: shopsphere-backend
    profiles: ["app"]
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "4000:4000"
    env_file: ./backend/.env
    environment:
      # Inside Docker the DB host is the service name, not localhost.
      MONGODB_URI: mongodb://mongo:27017/shopsphere?directConnection=true
      SMTP_HOST: mailpit

volumes:
  mongo-data:
  redis-data:
